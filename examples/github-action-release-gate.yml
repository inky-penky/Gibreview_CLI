# Copy to .github/workflows/qa-gate.yml in the repo you are shipping.
# Run it manually after testers have had time to submit (or on a schedule while a run is open).
# It collects results, pays complete work, publishes the JUnit report and fails the job if the release is blocked.
name: Crowd QA release gate

on:
  workflow_dispatch:
    inputs:
      pay:
        description: Pay valid testers and reject incomplete work
        type: boolean
        default: false

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      SOLANA_PRIVATE_KEY: ${{ secrets.BUGBASH_SOLANA_PRIVATE_KEY }}
      GIBWORK_ENV: production
    steps:
      - uses: actions/checkout@v4   # .bugbash/ run state must be committed or restored from an artifact
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g github:YOUR_GITHUB_USER/gibwork-bugbash
      - run: bugbash collect
      - if: ${{ inputs.pay }}
        run: bugbash triage --apply
      - run: bugbash report --out qa-report
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: qa-report, path: qa-report }
      - if: always()
        uses: mikepenz/action-junit-report@v4
        with: { report_paths: qa-report/junit.xml, check_name: Crowd QA }
