# Review brief for a writing bounty. Start one with: gibreview init brief.yaml --preset content
name: Beginner guide to the payments API
preset: content            # default fields: link (must open) and summary (30 to 250 words)
description: |
  Write a beginner-friendly guide to our three payments endpoints: create a payment, check its status and refund it.

  Publish it on your own blog or a developer site and include a full request and response example for every call.
bounty:                    # used by "publish" and "text"; "attach" reads these from Gibwork instead
  pool: "60.00"            # everything put into escrow
  minimum: "10.00"         # payment tab: the least any approved submission is paid (defaults to the smallest payout)
  category: Misc           # Social Media | Development | Design | Feedback | Misc
  access: everyone         # everyone | verified | discord | link (link is website-only)
  deadlineHours: 72
  tags: [Docs, Writing]
criteria:
  - { text: Covers all three endpoints with working examples, weight: 40 }
  - { text: Accurate against the API reference, weight: 40 }
  - { text: Clear for someone new to payments, weight: 20 }
payout:
  rule: multiple-winners   # one-winner | multiple-winners | pool
  amounts: ["30.00", "20.00", "10.00"]   # 1st, 2nd, 3rd; none below the minimum
review:
  duplicates: 0.85         # a later submission this similar to an earlier one is a copy
  order: first-come        # tie-breaker: first-come or reputation
